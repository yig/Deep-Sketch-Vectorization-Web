[project]
name = "deepsketch-web-tools"
version = "0.1.0"
description = "Offline tooling for the browser port: ONNX export and golden fixtures from the reference Python pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "onnx",
    "onnxruntime",
    "onnxconverter-common",
    "numpy<2",
    "opencv-python",
    "pillow",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "svgpathtools",
    "rdp",
    "aabbtree",
    "edge_distance_aabb",
    "colorama",
    "tqdm",
    "matplotlib",
    "ndjson",
]

# On Linux (CI), use CPU-only PyTorch wheels instead of the multi-GB CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
